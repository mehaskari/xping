name: xping
title: xping
base: core22
# The released version. Only the release commit itself builds as exactly
# this version; every other commit on main builds as VERSION+gitN.HASH (see
# override-pull), so the automatic stable release can never pick up
# unreleased code that happens to carry the same version string.
version: '1.6.0'
adopt-info: xping
summary: Beautiful CLI network diagnostics
description: |
  xping turns ping, traceroute, MTR, DNS, TLS, HTTP, mail server, Wi-Fi
  and port checks into live, colour-coded terminal output, over IPv4 and
  IPv6. No root needed.

  "xping doctor" explains in plain words why a connection does not work.
  "xping monitor" follows many checks over time as a live dashboard, with
  alerts, a saved history and an HTML report ("xping report").

  Every command has a meaningful exit code, thresholds, and JSON / CSV /
  Markdown export, so it fits scripts, cron jobs and monitoring.

  Quick start: xping 8.8.8.8 · xping doctor · xping --help
  Documentation: https://mehaskari.github.io/xping/guide/

license: MIT
contact: iorganamis@gmail.com
website: https://mehaskari.github.io/xping/
source-code: https://github.com/mehaskari/xping
issues: https://github.com/mehaskari/xping/issues

grade: stable
confinement: strict

apps:
  xping:
    command: bin/xping
    completer: xping-completion.bash
    plugs:
      - network
      - network-observe
      - home
    environment:
      LC_ALL: C.UTF-8

parts:
  xping:
    plugin: python
    source: .
    python-packages:
      - certifi
    stage-packages:
      - iputils-ping
      - traceroute
      - iproute2
    override-pull: |
      craftctl default
      base="$(sed -n "s/^version: '\(.*\)'$/\1/p" snap/snapcraft.yaml)"
      subject="$(git log -1 --format=%s 2>/dev/null || true)"
      if git describe --tags --exact-match --match "v$base" >/dev/null 2>&1 \
         || printf '%s' "$subject" | grep -Eq "(release/|release v)${base}([^0-9]|$)"; then
        craftctl set version="$base"
      else
        craftctl set version="$base+git$(git rev-list --count HEAD 2>/dev/null || echo 0).$(git rev-parse --short=7 HEAD 2>/dev/null || echo unknown)"
      fi
    override-build: |
      craftctl default
      PYTHONPATH="$CRAFT_PART_SRC" python3 -m xping completion bash \
        > "$CRAFT_PART_INSTALL/xping-completion.bash"
      install -D -m 644 man/xping.1 \
        "$CRAFT_PART_INSTALL/share/man/man1/xping.1"
      gzip -9f "$CRAFT_PART_INSTALL/share/man/man1/xping.1"
