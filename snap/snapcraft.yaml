name: xping
title: xping
base: core22
version: '1.4.0'
summary: Beautiful CLI network diagnostics
description: |
  xping is a command-line network diagnostics tool with live,
  colour-coded, animated output.

  Quick start: xping 8.8.8.8
  Commands: ping, trace, mtr, lookup, dnscheck, propagation, rdns,
  tcp, tls, http, whois, portscan, ipscan, sweep, mtu, health,
  speedtest, net, listen, osdetect, check, profile, all, completion

  IPv4 and IPv6; meaningful exit codes and thresholds for scripts;
  --watch / --until-up; batch checks from a TOML/JSON file.

  Tab completion: source <(xping completion bash)
  Every diagnostic command supports --json --csv --markdown --quiet

license: MIT
contact: iorganamis@gmail.com
website: https://github.com/mehdiaskari/xping
source-code: https://github.com/mehdiaskari/xping
issues: https://github.com/mehdiaskari/xping/issues

grade: stable
confinement: strict

apps:
  xping:
    command: bin/xping
    plugs:
      - network
      - network-observe
      - home
    environment:
      LC_ALL: C.UTF-8

parts:
  xping:
    plugin: python
    source: .
    python-packages:
      - certifi
    stage-packages:
      - iputils-ping
      - traceroute
      - iproute2
    override-build: |
      craftctl default
      install -D -m 644 man/xping.1 \
        "$CRAFT_PART_INSTALL/share/man/man1/xping.1"
      gzip -9f "$CRAFT_PART_INSTALL/share/man/man1/xping.1"
