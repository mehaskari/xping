<text x="18" y="527" textLength="333.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#d6dae6">  </tspan><tspan fill="#82ffbe" class="b">✔</tspan><tspan fill="#d6dae6">  </tspan><tspan fill="#ffffff">X-Frame-Options</tspan><tspan fill="#d6dae6">             </tspan><tspan fill="#d6dae6" class="d">deny</tspan></text>
<text x="18" y="546" textLength="810.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#d6dae6">  </tspan><tspan fill="#82ffbe" class="b">✔</tspan><tspan fill="#d6dae6">  </tspan><tspan fill="#ffffff">Referrer-Policy</tspan><tspan fill="#d6dae6">             </tspan><tspan fill="#d6dae6" class="d">origin-when-cross-origin, strict-origin-when-cross-origin</tspan></text>
<text x="18" y="565" textLength="360.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#d6dae6">  </tspan><tspan fill="#ff506e" class="b">✘</tspan><tspan fill="#d6dae6">  </tspan><tspan fill="#ffffff">Permissions-Policy</tspan><tspan fill="#d6dae6">          </tspan><tspan fill="#d6dae6" class="d">not set</tspan></text>
