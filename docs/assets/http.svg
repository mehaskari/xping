<text x="18" y="470" textLength="693.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#d6dae6">  </tspan><tspan fill="#82ffbe" class="b">✔</tspan><tspan fill="#d6dae6">  </tspan><tspan fill="#ffffff">Strict-Transport-Security</tspan><tspan fill="#d6dae6">   </tspan><tspan fill="#d6dae6" class="d">max-age=31536000; includeSubdomains; preload</tspan></text>
<text x="18" y="489" textLength="819.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#d6dae6">  </tspan><tspan fill="#82ffbe" class="b">✔</tspan><tspan fill="#d6dae6">  </tspan><tspan fill="#ffffff">Content-Security-Policy</tspan><tspan fill="#d6dae6">     </tspan><tspan fill="#d6dae6" class="d">default-src &#x27;none&#x27;; base-uri &#x27;self&#x27;; child-src github.git…</tspan></text>
