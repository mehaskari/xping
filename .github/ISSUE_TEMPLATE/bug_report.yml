name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: xping version
      placeholder: "Run: xping --version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/Arch/other)
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed via
      options:
        - pipx / pip (PyPI)
        - Ubuntu PPA (apt)
        - Snap
        - From source
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell (for tab-completion issues)
      placeholder: "e.g. zsh 5.9 with oh-my-zsh, bash 3.2 (macOS), fish 3.7"
    validations:
      required: false
  - type: input
    id: command
    attributes:
      label: Command that triggered the bug
      placeholder: "e.g. xping ping google.com --watch"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour — paste full output including any traceback
    validations:
      required: true
