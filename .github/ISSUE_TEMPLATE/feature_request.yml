name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: stdlib
    attributes:
      label: Does this require external dependencies?
      options:
        - "No — can be done with stdlib"
        - "Yes — needs an external package"
        - "Not sure"
