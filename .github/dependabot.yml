# Workflow actions are pinned to commit SHAs (a moved tag cannot change
# what runs in CI or in releases); the github-actions entry below keeps
# those pins up to date through weekly PRs.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    # One PR for all actions: codeql-action's init/autobuild/analyze must
    # move together, and separate PRs conflict with each other.
    groups:
      actions:
        patterns: ["*"]
