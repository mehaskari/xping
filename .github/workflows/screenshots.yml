name: Screenshots

# Renders the README screenshots (docs/assets/*.svg) from real xping runs on
# a clean network, with scripts/screenshot.py. Run it by hand, download the
# "screenshots" artifact and commit the files that changed:
#   gh workflow run screenshots.yml
#   gh run download --name screenshots --dir docs/assets
# (GitHub's runners drop ICMP, so ping, trace and mtr are not among them.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render the README screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install xping's dependency
        run: python -m pip install certifi

      - name: Render
        run: |
          shot() { python scripts/screenshot.py "out/$1.svg" --cols 104 -- "${@:2}"; }
          shot dnscheck dnscheck github.com
          # the full response headers would make it twice as tall
          python scripts/screenshot.py out/http.svg --cols 104 --stop-at "Response headers" -- \
            http https://github.com
          shot tls tls github.com
          shot propagation propagation github.com
          cat > checks.toml << 'TOML'
          [[check]]
          name = "GitHub"
          type = "http"
          url = "https://github.com"

          [[check]]
          name = "PyPI"
          type = "http"
          url = "https://pypi.org/simple/xping/"

          [[check]]
          name = "github.com DNS"
          type = "lookup"
          host = "github.com"

          [[check]]
          name = "GitHub certificate"
          type = "tls"
          host = "github.com"
          min_days = 14

          [[check]]
          name = "GitHub SSH"
          type = "tcp"
          host = "github.com"
          port = 22
          TOML
          # monitor runs until stopped: the timeout ends it, the live table stays
          python scripts/screenshot.py out/monitor.svg --cols 104 --timeout 45 -- \
            monitor checks.toml --every 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: out/*.svg
