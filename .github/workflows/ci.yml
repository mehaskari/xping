name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=xping --cov-report=xml --cov-report=term-missing -v
      - name: Upload coverage
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check xping/
      - run: ruff format --check xping/

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version files match
        run: |
          python3 - << 'PYEOF'
          import re, sys
          files = {
              'pyproject.toml':   (open('pyproject.toml').read(),   r'version = "(.+?)"'),
              'xping/__init__.py':(open('xping/__init__.py').read(),r'__version__\s+=\s+"(.+?)"'),
              'man/xping.1':      (open('man/xping.1').read(),      r'"xping ([0-9]+\.[0-9]+\.[0-9]+)"'),
          }
          versions = {k: re.search(p, t).group(1) for k, (t, p) in files.items()}
          print("Versions:", versions)
          if len(set(versions.values())) != 1:
              print("VERSION MISMATCH"); sys.exit(1)
          print("✔", list(versions.values())[0])
          PYEOF

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, lint, version-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
