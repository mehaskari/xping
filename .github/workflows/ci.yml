name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# CI only needs to read the code (least privilege for the GITHUB_TOKEN)
permissions:
  contents: read

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=xping --cov-report=xml --cov-report=term-missing -v

  test-windows:
    # Windows is advertised as supported; run the suite there too. Kept
    # non-blocking until it has a green track record.
    name: Test — Python 3.12 / windows-latest
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # Failing tests become check-run annotations, readable without the raw log
      - run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - run: pytest -v

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check xping/ --config ruff.toml
      - run: ruff format --check xping/ --line-length 100

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check versions match
        run: |
          python3 - << 'PYEOF'
          import re, sys
          files = {
              'pyproject.toml':   (open('pyproject.toml').read(),   r'version = "(.+?)"'),
              'xping/__init__.py':(open('xping/__init__.py').read(),r'__version__\s*=\s*"(.+?)"'),
              'man/xping.1':      (open('man/xping.1').read(),      r'"xping ([0-9]+\.[0-9]+\.[0-9]+)"'),
              'setup.cfg':        (open('setup.cfg').read(),        r'(?m)^version = (.+)$'),
              'snap/snapcraft.yaml': (open('snap/snapcraft.yaml').read(), r"(?m)^version: '(.+?)'"),
              'debian/changelog': (open('debian/changelog').read(), r'^xping \(([^)-]+)'),
          }
          v = {k: re.search(p, t).group(1) for k, (t, p) in files.items()}
          print("Versions:", v)
          if len(set(v.values())) != 1:
              print("VERSION MISMATCH"); sys.exit(1)
          print("All consistent:", list(v.values())[0])
          PYEOF

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, lint, version-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
