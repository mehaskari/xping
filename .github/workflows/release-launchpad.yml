name: Release — Launchpad PPA

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  upload-ppa:
    name: Build & upload to Launchpad PPA
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dh-python python3-all \
            python3-setuptools python3-certifi gnupg dput

      # GPG in a CI runner has no controlling terminal at all, so any
      # attempt by gpg/gpg-agent to open one for a pinentry prompt fails
      # with "Inappropriate ioctl for device". Fixed with no-tty +
      # loopback pinentry below. That alone is enough for a passphrase-
      # less key, but if the signing key DOES have a passphrase, gpg
      # still refuses in strict batch mode with "we are in batchmode -
      # can't get input" unless the passphrase is supplied explicitly.
      #
      # This step handles BOTH cases with one code path: it writes
      # secrets.LAUNCHPAD_GPG_PASSPHRASE (empty string if the key has no
      # passphrase — perfectly valid) to a private file and points a
      # tiny gpg wrapper at it via --passphrase-file, then tells
      # debuild/dpkg-buildpackage to sign through that wrapper with -p.
      - name: Configure GPG for non-interactive signing
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          cat > ~/.gnupg/gpg.conf << 'GPGCONF'
          batch
          yes
          no-tty
          pinentry-mode loopback
          GPGCONF
          cat > ~/.gnupg/gpg-agent.conf << 'AGENTCONF'
          allow-loopback-pinentry
          AGENTCONF
          chmod 600 ~/.gnupg/gpg.conf ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent 2>/dev/null || true

          printf '%s' "${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}" > "$RUNNER_TEMP/gpg-passphrase.txt"
          chmod 600 "$RUNNER_TEMP/gpg-passphrase.txt"

          cat > "$RUNNER_TEMP/gpg-wrapper.sh" << WRAPPER
          #!/bin/bash
          exec gpg --batch --no-tty --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/gpg-passphrase.txt" "\$@"
          WRAPPER
          chmod 700 "$RUNNER_TEMP/gpg-wrapper.sh"

      - name: Import GPG key
        run: |
          echo "${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --list-secret-keys

      - name: Build and sign source package
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))")
          echo "Building xping $VERSION"
          tar \
            --exclude='.git' --exclude='debian' --exclude='dist' \
            --exclude='build' --exclude='*.egg-info' --exclude='.venv' \
            --exclude='__pycache__' \
            -czf "../xping_${VERSION}.orig.tar.gz" .
          debuild -S -sa -k"${{ secrets.LAUNCHPAD_GPG_KEY_ID }}" -p"$RUNNER_TEMP/gpg-wrapper.sh"

      - name: Clean up passphrase file
        if: always()
        run: rm -f "$RUNNER_TEMP/gpg-passphrase.txt" "$RUNNER_TEMP/gpg-wrapper.sh"

      - name: Lintian check
        run: lintian --no-tag-display-limit ../xping_*.changes || true

      - name: Upload to Launchpad PPA
        run: |
          cat > ~/.dput.cf << 'DPUTEOF'
          [ppa-xping]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~mehdiaskari/ubuntu/xping/
          login = anonymous
          allow_unsigned_uploads = 0
          DPUTEOF
          dput ppa:mehdiaskari/xping ../xping_*.changes
          echo "✔ Uploaded — check: https://launchpad.net/~mehdiaskari/+archive/ubuntu/xping"
