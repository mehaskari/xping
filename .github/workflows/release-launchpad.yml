name: Release — Launchpad PPA

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  upload-ppa:
    name: Build & upload to Launchpad PPA
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Debian build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dh-python python3-all \
            python3-setuptools python3-certifi gnupg dput

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "Key imported:"
          gpg --list-secret-keys

      - name: Extract version
        id: ver
        run: |
          VERSION=$(python3 -c "
          import re
          print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building xping $VERSION"

      - name: Build orig tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          tar \
            --exclude='.git' \
            --exclude='debian' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='*.egg-info' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            -czf "../xping_${VERSION}.orig.tar.gz" .
          echo "Created: ../xping_${VERSION}.orig.tar.gz"

      - name: Build source package
        run: |
          debuild -S -sa -k"${{ secrets.LAUNCHPAD_GPG_KEY_ID }}"

      - name: Lintian check
        run: lintian --no-tag-display-limit ../xping_*.changes || true

      - name: Configure dput
        run: |
          cat > ~/.dput.cf << 'DPUTEOF'
          [ppa-xping]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~mehdiaskari/ubuntu/xping/
          login = anonymous
          allow_unsigned_uploads = 0
          DPUTEOF

      - name: Upload to Launchpad PPA
        run: |
          CHANGES=$(ls ../*.changes | head -1)
          echo "Uploading: $CHANGES"
          dput ppa:mehdiaskari/xping "$CHANGES"
          echo "✔ Uploaded to PPA — check build at:"
          echo "  https://launchpad.net/~mehdiaskari/+archive/ubuntu/xping"
