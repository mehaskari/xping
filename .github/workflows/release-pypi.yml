name: Release — PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xping
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog entry
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - << PYEOF
          import re, os
          text = open('docs/changelog.md').read()
          ver = '$VERSION'
          m = re.search(rf'## \[{re.escape(ver)}\].*?(?=## \[|\Z)', text, re.DOTALL)
          entry = m.group(0).strip() if m else f'Release {ver}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'notes<<NOTES_EOF\n{entry}\nNOTES_EOF\n')
          PYEOF
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "xping ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          files: dist/*
