name: Release — PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xping
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - << PYEOF
          import re, os
          text = open('docs/changelog.md').read()
          ver = '$VERSION'
          m = re.search(rf'## \[{re.escape(ver)}\].*?(?=## \[|\Z)', text, re.DOTALL)
          entry = m.group(0).strip() if m else f'Release {ver}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'notes<<NOTES_EOF\n{entry}\nNOTES_EOF\n')
          PYEOF
      - uses: softprops/action-gh-release@v2
        with:
          name: "xping ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          files: dist/*
